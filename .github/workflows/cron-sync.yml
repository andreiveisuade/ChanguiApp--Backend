name: Cron sync Precios Claros

on:
  schedule:
    # 09:00 UTC = 06:00 Argentina (UTC-3). GitHub puede atrasar/saltear
    # corridas programadas bajo carga; no garantiza ejecución diaria exacta.
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # El runner baja el catálogo de Precios Claros y lo postea al backend en
      # lotes. El fetch al CDN se hace acá y NO desde Render porque la IP
      # saliente compartida del free tier de Render está filtrada por el CDN de
      # Precios Claros y recibe 200 con catálogo vacío (total 0). La IP del
      # runner está limpia. El backend solo upsertea lo que le mandamos.
      - name: Sincronizar catálogo Precios Claros -> backend
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PRECIOS_CLAROS_URL: ${{ vars.PRECIOS_CLAROS_URL }}
          STORE_ID: ${{ vars.MVP_STORE_PRECIOS_CLAROS_ID }}
        run: |
          set -euo pipefail

          UA="Mozilla/5.0 (compatible; ChanguiApp/1.0)"
          LIMIT=100

          # 1) total del catálogo de la sucursal.
          head=$(curl -sS -m 30 -H "User-Agent: $UA" \
            "$PRECIOS_CLAROS_URL/productos?string=&limit=1&offset=0&id_sucursal=$STORE_ID")
          total=$(echo "$head" | jq -r '.total // 0')
          echo "Catálogo: total=$total productos"

          # Un catálogo real nunca es 0. Si lo es, la API está caída de verdad
          # (no la IP): cortamos sin pisar el catálogo bueno con un sync vacío.
          if [ "$total" -eq 0 ]; then
            echo "::error::Precios Claros devolvió total 0 desde el runner (API caída, no IP)."
            exit 1
          fi

          # 2) Paginar y postear cada página al backend.
          offset=0
          upserted_total=0
          while [ "$offset" -lt "$total" ]; do
            page=$(curl -sS -m 30 -H "User-Agent: $UA" \
              "$PRECIOS_CLAROS_URL/productos?string=&limit=$LIMIT&offset=$offset&id_sucursal=$STORE_ID")

            count=$(echo "$page" | jq -r '.productos | length')
            if [ "$count" -eq 0 ]; then
              echo "Página vacía en offset=$offset: fin del catálogo."
              break
            fi

            resp=$(echo "$page" | jq -c '{productos: .productos}' | curl -sS -m 60 \
              -w "\n%{http_code}" \
              -X POST "$BACKEND_URL/api/admin/products/bulk" \
              -H "X-Admin-Token: $ADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @-)
            body=$(echo "$resp" | head -n -1)
            status=$(echo "$resp" | tail -n 1)
            if [ "$status" != "200" ]; then
              echo "::error::bulk devolvió $status — $body"
              exit 1
            fi

            upserted=$(echo "$body" | jq -r '.upserted // 0')
            upserted_total=$((upserted_total + upserted))
            offset=$((offset + count))
            echo "offset=$offset/$total (upserteados acumulados=$upserted_total)"

            # Respiro entre requests al CDN para no autoinducir rate-limit.
            sleep 1
          done

          echo "Ingesta completa: $upserted_total productos upserteados."

          # 3) Reclasificación fiscal de los productos no bloqueados.
          echo "Disparando reclasificación fiscal…"
          resp=$(curl -sS -m 300 -w "\n%{http_code}" \
            -X POST "$BACKEND_URL/api/admin/reclassify" \
            -H "X-Admin-Token: $ADMIN_TOKEN")
          body=$(echo "$resp" | head -n -1)
          status=$(echo "$resp" | tail -n 1)
          if [ "$status" != "200" ]; then
            echo "::error::reclassify devolvió $status — $body"
            exit 1
          fi
          echo "Reclasificación OK: $body"
